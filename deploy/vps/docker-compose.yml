# Тестовый сервер на любом VPS (Ubuntu 22.04+, 1 ГБ RAM) с автоматическим HTTPS через Caddy.
# Запуск: см. deploy/vps/install.sh и docs/RUNBOOK.md
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: blizkie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: blizkie
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blizkie"]
      interval: 3s
      retries: 30
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://blizkie:${POSTGRES_PASSWORD}@db:5432/blizkie
      PORT: 8080
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      REGISTRATION_KEY: ${REGISTRATION_KEY:-}
      LOCATION_TTL_HOURS: ${LOCATION_TTL_HOURS:-24}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-none}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env, например 203.0.113.10.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - api
volumes:
  dbdata:
  caddydata:
